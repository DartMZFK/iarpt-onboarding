</script>
<style>
:root{--red:#BD292D;--dark:#70142A;--bg:#FBF7F2;--ink:#2A1A1A;--body:#4A3B3B;--grey:#8A7A76;--line:#E8D6CF;--pink:#F0D9D3;--cream:#FFE8D1;--peach:#F5E5D4;--tg:#239ED9;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:'Manrope',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.serif{font-family:'Lora',Georgia,serif}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.hidden{display:none!important}
.kicker{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;font:700 17px/1 'Manrope',sans-serif;color:#fff;background:var(--red);padding:18px 30px;border-radius:999px;text-decoration:none;transition:transform .15s,box-shadow .15s;box-shadow:0 10px 24px -12px rgba(189,41,45,.6)}
.btn:hover{transform:translateY(-1px);box-shadow:0 14px 28px -12px rgba(189,41,45,.7)}
.btn.ghost{background:transparent;color:var(--red);box-shadow:none;border:1.5px solid var(--line)}
.btn.tg{background:var(--tg);box-shadow:0 10px 24px -12px rgba(35,158,217,.6)}
.btn.block{width:100%}
.meta{font-size:13px;color:var(--grey);margin-top:14px}
/* ---- header ---- */
header.top{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
header.top img{height:34px}
header.top .tag{font-size:12px;color:var(--grey)}
/* ---- hero ---- */
.hero{background:var(--red);color:#fff;position:relative;overflow:hidden;padding:56px 0 64px;border-radius:0 0 32px 32px}
.hero .rings{position:absolute;right:-120px;top:-60px;width:520px;height:520px;pointer-events:none;opacity:.55}
.hero .kicker{color:var(--cream)}
.hero h1{font-family:'Lora',serif;font-weight:600;font-size:38px;line-height:1.12;margin:16px 0 22px;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--cream);font-weight:400}
.hero p.lead{font-size:18px;line-height:1.5;max-width:560px;margin:0 0 30px;color:rgba(255,255,255,.92)}
.hero .btn{background:#fff;color:var(--red);box-shadow:0 12px 30px -10px rgba(0,0,0,.35)}
.hero .meta{color:rgba(255,255,255,.75)}
/* ---- sections ---- */
section.sec{padding:52px 0 8px}
h2.h{font-family:'Lora',serif;font-weight:600;font-size:28px;line-height:1.2;margin:8px 0 18px;letter-spacing:-.01em}
p.big{font-family:'Lora',serif;font-size:20px;line-height:1.45;color:var(--ink);margin:0 0 18px}
p{margin:0 0 14px;color:var(--body);font-size:16.5px}
.wants{display:grid;gap:12px;margin:26px 0 10px}
.want{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;display:flex;gap:16px;align-items:flex-start}
.want i{flex:0 0 40px;height:40px;border-radius:50%;background:var(--pink);display:flex;align-items:center;justify-content:center;font-style:normal;color:var(--red);font-weight:800;font-family:'Lora',serif;font-size:17px}
.want b{display:block;font-family:'Lora',serif;font-weight:600;font-size:18px;color:var(--ink);margin-bottom:2px}
.want span{color:var(--body);font-size:15.5px}
.quote-card{background:var(--dark);color:#fff;border-radius:22px;padding:30px 28px;margin:26px 0}
.quote-card .kicker{color:#E6AAAF}
.quote-card h3{font-family:'Lora',serif;font-weight:600;font-size:24px;line-height:1.2;margin:10px 0 12px}
.quote-card p{color:rgba(255,255,255,.88);font-size:16px}
.voices{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.voices span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 14px;font-family:'Lora',serif;font-size:15px}
.mapcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;margin:22px 0}
.mapcard ul{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}
.mapcard li{position:relative;padding-left:30px;font-size:16px;color:var(--ink)}
.mapcard li::before{content:"";position:absolute;left:0;top:6px;width:16px;height:16px;border-radius:50%;background:var(--red);box-shadow:inset 0 0 0 4px var(--pink)}
.tgline{display:flex;align-items:center;gap:12px;margin-top:18px;padding-top:18px;border-top:1px solid var(--line);color:var(--ink);font-weight:600}
.tgline i{width:34px;height:34px;border-radius:50%;background:var(--tg);display:inline-flex;align-items:center;justify-content:center;flex:0 0 34px}
.lessons{display:grid;gap:12px;margin:20px 0 6px}
.lesson{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;display:flex;gap:16px}
.lesson .n{flex:0 0 44px;height:44px;border-radius:50%;background:#EAC0B3;color:var(--red);font-family:'Lora',serif;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center}
.lesson b{display:block;font-family:'Lora',serif;font-weight:600;font-size:18px;color:var(--ink);margin-bottom:4px}
.lesson span{color:var(--body);font-size:15.5px}
.gift{display:inline-flex;align-items:center;gap:8px;background:var(--peach);color:var(--dark);font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px;margin-bottom:10px}
.tip{background:var(--peach);border-radius:18px;padding:18px 22px;font-family:'Lora',serif;font-size:17px;color:var(--ink);margin:26px 0}
.cta{background:#fff;border:1px solid var(--line);border-radius:26px;padding:34px 28px;text-align:center;margin:34px 0 20px}
.cta .btn{font-size:18px;padding:20px 36px}
.author{display:flex;gap:18px;align-items:flex-start;border-left:3px solid var(--red);padding:4px 0 4px 18px;margin:26px 0 40px}
.author b{display:block;font-size:17px;color:var(--ink)}
.author span{font-size:15px;color:var(--body)}
footer{padding:20px 0 50px;font-size:12.5px;color:var(--grey);text-align:center}
/* ---- quiz ---- */
.app{max-width:640px;margin:0 auto;padding:24px 20px 60px;min-height:100vh}
.app-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.app-top img{height:28px}
.app-top button{background:none;border:0;color:var(--grey);font:600 14px 'Manrope',sans-serif;cursor:pointer}
.prog{height:6px;background:var(--pink);border-radius:3px;overflow:hidden;margin:0 0 10px}
.prog i{display:block;height:100%;background:var(--red);border-radius:3px;transition:width .3s}
.pmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--grey);margin-bottom:26px}
.pmeta b{color:var(--red);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.qtitle{font-family:'Lora',serif;font-weight:600;font-size:23px;line-height:1.28;margin:0 0 8px;color:var(--ink)}
.qhint{font-size:14.5px;color:var(--grey);margin:0 0 18px}
.opts{display:grid;gap:10px;margin:18px 0}
.opt{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:15px 18px;cursor:pointer;font-size:16px;color:var(--ink);transition:border-color .15s,background .15s;text-align:left;width:100%;font-family:inherit}
.opt:hover{border-color:#D9A9A9}
.opt.on{border-color:var(--red);background:#FFF5F3}
.opt i{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid #D9C3BD;margin-top:1px;position:relative}
.opt.multi i{border-radius:6px}
.opt.on i{border-color:var(--red);background:var(--red)}
.opt.on i::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
textarea,input[type=text]{width:100%;font:16px 'Manrope',sans-serif;padding:16px 18px;border:1.5px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);outline:none;resize:vertical}
textarea:focus,input:focus{border-color:var(--red)}
.counter{font-size:12.5px;color:var(--grey);text-align:right;margin-top:6px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:26px}
.link{background:none;border:0;color:var(--grey);font:600 15px 'Manrope',sans-serif;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.card-intro{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px}
.card-intro h2{font-family:'Lora',serif;font-weight:600;font-size:26px;margin:6px 0 10px}
.card-intro label{display:block;font-size:13px;font-weight:700;color:var(--grey);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.06em}
.small{font-size:13.5px;color:var(--grey)}
/* ---- result ---- */
.rhero{background:var(--red);color:#fff;border-radius:26px;padding:34px 28px;margin-bottom:22px}
.rhero .kicker{color:var(--cream)}
.rhero h2{font-family:'Lora',serif;font-weight:600;font-size:30px;line-height:1.15;margin:10px 0 8px}
.rhero p{color:rgba(255,255,255,.88)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.tile small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--grey);font-weight:700;margin-bottom:6px}
.tile b{font-family:'Lora',serif;font-weight:600;font-size:15.5px;line-height:1.25;color:var(--ink)}
.tile.red b{color:var(--red)}
.tile.wide{grid-column:1/-1;background:var(--dark);border-color:var(--dark)}
.tile.wide small{color:#E6AAAF}.tile.wide b{color:#fff}
.actions{display:grid;gap:12px;margin:22px 0}
.lead-gate{margin:24px 0 8px;border:1px solid var(--line);border-radius:24px;padding:24px;background:#fff}
.lead-gate[hidden]{display:none!important}
.lead-gate-head{margin-bottom:18px}
.lead-gate-head .kicker{display:inline-block;margin-bottom:8px;color:#102550;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.lead-gate-head h3{margin:0 0 8px;font-family:'Cormorant SC',Georgia,'Times New Roman',serif;font-size:28px;line-height:1.12;color:var(--ink)}
.lead-gate-head p{margin:0;color:var(--body);font-size:14px;line-height:1.6}
.lead-gate-widget{min-height:160px;border-radius:18px;background:#f7f9fd;overflow:hidden}
.lead-gate-widget iframe{display:block;width:100%!important;max-width:100%;border:0!important}
.lead-gate-lock{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:#f3f6fc;color:#52627b;font-size:12.5px;line-height:1.55}
.lead-gate-success{background:#edf5ef;color:#2f6941}
.lead-gate .actions{margin-bottom:12px}
@media(max-width:600px){.lead-gate{padding:18px;border-radius:20px}.lead-gate-head h3{font-size:24px}}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:600px){.hero{padding:44px 0 52px;border-radius:0 0 24px 24px}.hero h1{font-size:31px}h2.h{font-size:24px}.tiles{grid-template-columns:1fr}.btn{font-size:16px;padding:17px 24px}.qtitle{font-size:20.5px}}
</style>
<style>

:root{--red:#bc2c2c;--dark:#102550;--bg:#f3f6fc;--ink:#102550;--body:#354765;--grey:#60708a;--line:#d7e0ef;--pink:#e8f0ff;--cream:#ffe0b8;--peach:#e8f0ff;--tg:#102550}
html{overflow-y:auto;scroll-behavior:auto;scrollbar-gutter:stable;overscroll-behavior-y:contain}

.app-top{margin-bottom:24px;gap:16px}.app-top img{height:30px;width:auto}.app-top button{font-family:inherit;min-height:44px;padding:10px 8px;color:#3d5171}
.btn,.link,input[type=text],textarea{font-family:inherit}.btn{font-size:15px;line-height:1.35;min-height:52px;box-shadow:none}.btn.tg{background:var(--dark)}

button,a,input,textarea{-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible{outline:3px solid #b2793a;outline-offset:3px}

.qtitle{font-size:clamp(27px,4vw,34px);line-height:1.12;margin-bottom:14px}.qtitle:focus-visible,.rhero h2:focus-visible{outline:0}
.qhint{font-size:14px;line-height:1.65}.pmeta{gap:12px;align-items:baseline}.pmeta b{color:#102550;line-height:1.5}.pmeta span{white-space:nowrap;font-size:12px}
.prog{background:#dce6f5}.prog i{background:#102550}
.card-intro{padding:32px;border-radius:26px}.card-intro h2{font-size:36px;line-height:1.1;margin:12px 0 16px}.card-intro .kicker{color:#102550}
.nav{gap:20px}.card-intro .nav .small{max-width:265px;line-height:1.6}.card-intro .nav .btn{min-width:126px}

.tile{border-color:#d7e0ef}.tile b{font-family:Inter,system-ui,sans-serif;font-size:15px;font-weight:600;line-height:1.4}.tile.red b{color:#102550}.tile small{font-size:10px;line-height:1.6}
.tile.wide{background:#102550;border-color:#102550}.tile.wide small{color:#ffe0b8}.rhero{background:#102550}.rhero h2{font-size:36px}.rhero p{font-size:15px;line-height:1.65}
.input-error{font-family:inherit;font-size:13px;color:#a32323;margin:8px 0 0}[hidden]{display:none!important}input[aria-invalid=true]{border-color:#bc2c2c}
.link{min-height:44px;padding:8px 0;color:#4d607d}.small{line-height:1.65}.spinner{border-color:#ccd5e6;border-top-color:#102550}
@media(max-width:600px){html{scrollbar-gutter:auto}.app{padding:18px 18px 32px}.app-top{margin-bottom:16px}.card-intro{padding:24px 20px;border-radius:22px}.card-intro h2{font-size:31px}.nav{gap:14px}.card-intro .nav{align-items:stretch;flex-direction:column}.card-intro .nav .small{max-width:none}.card-intro .btn{width:100%}.pmeta{flex-wrap:wrap;row-gap:5px;margin-bottom:22px}.qtitle{font-size:28px}.opt{padding:14px;font-size:15px}.tiles{grid-template-columns:1fr}.rhero{padding:26px 22px}.rhero h2{font-size:31px}.rhero p{font-size:14px}input[type=text],textarea{font-size:16px}.btn{font-size:15px}.tile{padding:18px}.actions{gap:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition:none!important;scroll-behavior:auto!important}}

<script>
/* Публичная конфигурация теста. Секреты и BOT_TOKEN здесь не размещать.
   При пустом apiUrl ответы никуда не отправляются; результат и PDF строятся в браузере. */
window.IARPT_QUIZ_RUNTIME = (function () {
  var config = {apiUrl: '', botUsername: '', allowDownload: true, timeoutMs: 10000};
  // В адресе только одноразовый канал и origin родителя; имени и ответов в URL нет.
  try {
    var params = new URLSearchParams(window.location.hash.slice(1));
    var channel = params.get('iq-channel') || '';
    var origin = params.get('iq-parent') || '';
    var validOrigin = origin === 'null' ||
      (/^https?:\/\//.test(origin) && new URL(origin).origin === origin);
    if (window.parent !== window && /^[a-z0-9-]{16,160}$/i.test(channel) && validOrigin) {
      config.channel = channel;
      config.parentOrigin = origin;
    }
  } catch (_) { /* При открытии отдельно работает обычный тест. */ }
  return config;
}());
</script>

  actions.innerHTML =
    (botUrl ? `<a class="btn block tg" href="${esc(botUrl)}" target="_blank" rel="noopener noreferrer">Получить карту в Telegram ↗</a>` : '') +
    (CONFIG.allowDownload || !botUrl ? '<button class="btn block ghost" id="dl" type="button" onclick="downloadPdf()">Скачать PDF здесь</button>' : '');
  status.textContent = message;
  gate.hidden = false;
  if (leadUnlocked) {
    if (widget) widget.hidden = true;
    if (lock) {
      lock.classList.add('lead-gate-success');
      lock.textContent = 'Контакт уже получен в этой сессии. PDF-карта открыта.';
    }
    actions.hidden = false;
  } else {
    if (widget) widget.hidden = false;
    if (lock) {
      lock.classList.remove('lead-gate-success');
      lock.textContent = 'PDF пока закрыт — сначала отправьте контакт через форму выше.';
    }
    actions.hidden = true;
    watchLeadGateFrame();
  }
}
window.addEventListener('message', event => {
  const data = event.data;
  if (!data || data.ns !== 'iarpt-gc-gate' || data.type !== 'submitted' || leadUnlocked) return;
  const frame = leadFrame || $('#leadGateWidget')?.querySelector('iframe');
  if (!frame || event.source !== frame.contentWindow) return;
  const allowedOrigin = event.origin === 'null' || event.origin === window.location.origin || event.origin === 'https://achernigova.online';
  if (!allowedOrigin) return;
  unlockLeadGate('callback');
});

function renderResult() {
  currentView = 'result'; PROFILE = compute(A); TOKEN = token(PROFILE);
  const p = PROFILE, first = userName.split(/\s+/)[0], botUrl = telegramUrl();
  const nl = t => esc(t.replace(/\n/g, ' '));
  const react = p.react.length > 1 ? nl(p.react[0].tile) + ' · ' + nl(p.react[1].tile).toLowerCase() : nl(p.react[0].tile);
  const intro = 'Чтобы забрать её, заполните данные в форме ниже, а затем получите карту в чат-боте Академии.';
  const message = botUrl
    ? 'В Telegram бот пришлёт вашу PDF-карту и откроет три бесплатных видеоурока — смотрите их по порядку. Карта описывает ваши ответы для самонаблюдения и не является диагнозом.'
    : (resultMode === 'unavailable' ? 'Сервис отправки в Telegram сейчас недоступен. После отправки формы ниже откроется скачивание PDF.' : 'После отправки формы ниже откроется скачивание PDF-карты.') + ' Карта описывает ваши ответы для самонаблюдения и не является диагнозом.';
  $('#backBtn').style.visibility = 'hidden';
  $('#qArea').innerHTML = `<div class="rhero"><span class="kicker">Карта собрана</span><h2>Ваша персональная карта готова</h2><p>${intro}</p></div>
    <div class="tiles">
      <div class="tile red"><small>Главная сфера</small><b>${nl(p.sphere.tile)}</b></div>
      <div class="tile"><small>Движение к цели</small><b>${nl(p.move.tile)}</b></div>
      <div class="tile"><small>Перед важным шагом</small><b>${react}</b></div>
      <div class="tile"><small>Телесный отклик</small><b>${nl(p.body.tile)}</b></div>
      <div class="tile"><small>Что важно сохранить</small><b>${nl(p.keep.tile)}</b></div>
      <div class="tile"><small>Внутренняя опора</small><b>${nl(p.support.tile)}</b></div>
      <div class="tile wide"><small>Ваш темп</small><b>${nl(p.tempo.tile)}</b></div>
    </div>
    <p class="small"><button class="link" type="button" onclick="restartQuiz()">Пройти заново</button></p>`;
  showLeadGate(botUrl, message);
  resetScroll(); focusCurrent();
}
function downloadPdf() {
  const button = $('#dl');
  if (!leadUnlocked) {
    $('#leadGateLock')?.scrollIntoView({behavior: reduced.matches ? 'auto' : 'smooth', block:'center'});
    return;
  }
  if (!button || button.disabled || !PROFILE) return;
  button.innerHTML = '<span class="spinner" aria-hidden="true"></span> Собираю PDF…'; button.disabled = true;
  setTimeout(() => {
    try {
      const doc = buildPdf(PROFILE, userName, {botUrl: telegramUrl()});
      const name = (userName.split(/\s+/)[0] || '').replace(/[<>:"/\\|?*\x00-\x1f]/g, '').slice(0, 40) || 'Участник';
      doc.save('Карта_' + name + '.pdf');
    } catch (_) {
      $('#delivery-status').textContent = 'Не удалось собрать PDF. Нажмите «Скачать PDF здесь» ещё раз.';
    } finally { button.textContent = 'Скачать PDF здесь'; button.disabled = false; }
  }, 60);
}
function restartQuiz() {
  generation++; activeRequest?.abort(); cancelAdvance();
  A = {}; idx = -1; userName = ''; PROFILE = null; TOKEN = ''; SERVER = null;
  startQuiz();
}
window.addEventListener('message', event => {
  const d = event.data;
  if (event.source !== window.parent || !d || d.ns !== 'iarpt-quiz-handoff' || d.channel !== supplied.channel || event.origin !== supplied.parentOrigin) return;
  if (d.type === 'suspend') { viewActive = false; document.activeElement?.blur?.(); }
  if (d.type === 'focus') { viewActive = true; focusCurrent(); }
  if (d.type === 'focus-first' || d.type === 'focus-last') {
    viewActive = true;
    const nodes = Array.from(document.querySelectorAll('a[href],button:not([disabled]),input,textarea')).filter(el => getComputedStyle(el).visibility !== 'hidden' && el.getClientRects().length);
    (d.type === 'focus-last' ? nodes[nodes.length - 1] : nodes[0])?.focus({preventScroll:true});
  }
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && !event.isComposing) { event.preventDefault(); notify('close'); }
  // Cross-frame focus loop: Shift+Tab from the first item / Tab from the last returns to the close button.
  if (event.key === 'Tab' && supplied.channel && window.parent !== window) {
    const list = Array.from(document.querySelectorAll('a[href], button:not([disabled]), input, textarea')).filter(el => getComputedStyle(el).visibility !== 'hidden' && el.getClientRects().length);
    if ((event.shiftKey && document.activeElement === list[0]) || (!event.shiftKey && document.activeElement === list[list.length - 1])) {
      event.preventDefault(); notify('focus-close');
    }
  }
});
window.addEventListener('error', () => notify('error'));
startQuiz();
notify('ready');

</script>
