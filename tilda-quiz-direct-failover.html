<div id="iarpt-quiz-modal" role="dialog" aria-modal="true" aria-labelledby="iarpt-quiz-title" hidden>
  <div class="iq-window">
    <div class="iq-bar"><div><p class="iq-title" id="iarpt-quiz-title">Персональная карта изменений</p><p class="iq-subtitle">iARPT · Бесплатный тест · 21 вопрос</p></div><button class="iq-close" type="button" aria-label="Закрыть тест">×</button></div>
    <div class="iq-stage"><div class="iq-status" role="status" aria-live="polite"><span class="iq-spin" aria-hidden="true"></span><p data-iq-status>Открываем тест…</p><button class="iq-retry" type="button" hidden>Попробовать ещё раз</button><a class="iq-external" target="_blank" rel="noopener noreferrer" hidden>Открыть тест в новой вкладке ↗</a></div></div>
  </div>
</div>
<script>
(() => {
  'use strict';
  if (window.IARPTQuiz) return;
  const modal = document.getElementById('iarpt-quiz-modal');
  const stage = modal.querySelector('.iq-stage');
  const status = modal.querySelector('.iq-status');
  const statusText = modal.querySelector('[data-iq-status]');
  const retry = modal.querySelector('.iq-retry');
  const external = modal.querySelector('.iq-external');
  const closeButton = modal.querySelector('.iq-close');
  const triggerSelector = '[data-iarpt-quiz], [data-ih-open], a[href="#iarpt-test"], a[href="#iarpt-quiz"]';
  let frame, timeoutId, channel = '', index = 0, opener, previousOverflow = '';

  function sources() {
    try {
      const config = JSON.parse(document.getElementById('iarpt-quiz-config').textContent || '{}');
      if (Array.isArray(config.sources) && config.sources.length) return config.sources;
    } catch (_) {}
    return [{url:'https://card.iarpt.ru/quiz/iarpt-quiz.html', timeoutMs:9000},{url:'https://dartmzfk.github.io/iarpt-onboarding/iarpt-quiz.html', timeoutMs:15000}];
  }
  function clearTimers() { clearTimeout(timeoutId); }
  function showStatus(text, isError) {
    status.hidden = false; statusText.textContent = text;
    status.querySelector('.iq-spin').hidden = !!isError;
    retry.hidden = !isError;
  }
  function createChannel() { return 'iq-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2); }
  function sourceURL(source) {
    const url = new URL(source.url);
    url.hash = new URLSearchParams({'iq-parent': location.origin, 'iq-channel': channel}).toString();
    return url.href;
  }
  function failover() {
    const list = sources();
    if (index + 1 >= list.length) { showStatus('Тест не загрузился. Проверьте интернет или откройте его в новой вкладке.', true); return; }
    index += 1; load();
  }
  function load() {
    clearTimers();
    const source = sources()[index];
    if (!source || !/^https:\/\/(card\.iarpt\.ru|dartmzfk\.github\.io)\//.test(source.url || '')) { showStatus('Источник теста настроен неверно.', true); return; }
    channel = createChannel();
    frame?.remove();
    showStatus(index ? 'Пробуем резервный источник…' : 'Открываем тест…', false);
    external.href = source.url; external.hidden = false;
    frame = document.createElement('iframe');
    frame.className = 'iq-frame'; frame.title = 'Тест iARPT — персональная карта изменений';
    frame.referrerPolicy = 'strict-origin-when-cross-origin';
    frame.addEventListener('error', failover, {once:true});
    frame.src = sourceURL(source);
    stage.appendChild(frame);
    timeoutId = setTimeout(failover, Math.max(5000, Number(source.timeoutMs) || 45000));
  }
  window.addEventListener('message', event => {
    const source = sources()[index], d = event.data;
    if (!frame || !source || event.source !== frame.contentWindow || event.origin !== new URL(source.url).origin || !d || d.ns !== 'iarpt-quiz-handoff' || d.channel !== channel) return;
    if (d.type === 'ready') { clearTimeout(timeoutId); status.hidden = true; }
    if (d.type === 'error') failover();
  });
  function open(button) { if (!modal.hidden) return; opener = button || document.activeElement; previousOverflow = document.body.style.overflow; document.body.style.overflow = 'hidden'; modal.hidden = false; index = 0; load(); closeButton.focus({preventScroll:true}); }
  function close() { clearTimers(); frame?.remove(); frame = null; modal.hidden = true; document.body.style.overflow = previousOverflow; opener?.focus?.({preventScroll:true}); }
  retry.addEventListener('click', () => { index = 0; load(); });
  closeButton.addEventListener('click', close);
  modal.addEventListener('click', event => { if (event.target === modal) close(); });
  document.addEventListener('keydown', event => { if (event.key === 'Escape' && !modal.hidden) { event.preventDefault(); close(); } });
  document.addEventListener('click', event => {
    if (event.defaultPrevented || event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
    const button = event.target instanceof Element ? event.target.closest(triggerSelector) : null;
    if (!button) return;
    event.preventDefault(); open(button);
  }, true);
  window.IARPTQuiz = Object.freeze({open, close});
})();
</script>
