<div id="iarpt-quiz-modal" role="dialog" aria-modal="true" aria-labelledby="iarpt-quiz-title" hidden>
  <div class="iq-window">
    <div class="iq-bar"><div><p class="iq-title" id="iarpt-quiz-title">Персональная карта изменений</p><p class="iq-subtitle">iARPT · Бесплатный тест · 21 вопрос</p></div><button class="iq-close" type="button" aria-label="Закрыть тест">×</button></div>
    <div class="iq-stage"><div class="iq-status" role="status" aria-live="polite"><span class="iq-spin" aria-hidden="true"></span><p data-iq-status>Открываем тест…</p><button class="iq-retry" type="button" hidden>Попробовать ещё раз</button><a class="iq-external" target="_blank" rel="noopener noreferrer" hidden>Открыть тест в новой вкладке ↗</a></div></div>
  </div>
</div>
<script>
(() => {
  'use strict';
  if (window.IARPTQuiz) return;
  // Источники грузятся «гонкой»: основной стартует сразу, если он не ответил готовностью
  // за parallelAfterMs — параллельно стартует следующий, но основной НЕ обрывается.
  // Показываем тот, что первым прислал ready. Так медленный сервер без VPN не теряется,
  // а недоступный через VPN сервер не задерживает тест дольше нескольких секунд.
  const modal = document.getElementById('iarpt-quiz-modal');
  const stage = modal.querySelector('.iq-stage');
  const status = modal.querySelector('.iq-status');
  const statusText = modal.querySelector('[data-iq-status]');
  const retry = modal.querySelector('.iq-retry');
  const external = modal.querySelector('.iq-external');
  const closeButton = modal.querySelector('.iq-close');
  const triggerSelector = '[data-iarpt-quiz], [data-ih-open], a[href="#iarpt-test"], a[href="#iarpt-quiz"]';
  const ALLOWED = /^https:\/\/(card\.iarpt\.ru|dartmzfk\.github\.io)\//;
  const DEFAULTS = {sources:[{url:'https://card.iarpt.ru/quiz/iarpt-quiz.html', parallelAfterMs:2500},{url:'https://dartmzfk.github.io/iarpt-onboarding/iarpt-quiz.html', parallelAfterMs:2500}], giveUpMs:20000};
  let attempts = [], winner = null, timers = [], opener, previousOverflow = '', run = 0;

  function config() {
    try {
      const c = JSON.parse(document.getElementById('iarpt-quiz-config').textContent || '{}');
      if (Array.isArray(c.sources) && c.sources.length) return {sources: c.sources.filter(s => ALLOWED.test(s && s.url || '')), giveUpMs: Number(c.giveUpMs) || DEFAULTS.giveUpMs};
    } catch (_) {}
    return DEFAULTS;
  }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function showStatus(text, isError) {
    status.hidden = false; statusText.textContent = text;
    status.querySelector('.iq-spin').hidden = !!isError;
    retry.hidden = !isError;
  }
  function channelId() { return 'iq-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2); }
  function removeFrames(keep) { attempts.forEach(a => { if (a !== keep) a.frame.remove(); }); attempts = keep ? [keep] : []; }
  function start(i) {
    const list = config().sources;
    if (winner || i >= list.length || attempts.some(a => a.index === i)) return;
    const source = list[i], url = new URL(source.url);
    const attempt = {index: i, source, origin: url.origin, channel: channelId(), failed: false, frame: document.createElement('iframe')};
    url.hash = new URLSearchParams({'iq-parent': location.origin, 'iq-channel': attempt.channel}).toString();
    attempt.frame.className = 'iq-frame';
    attempt.frame.title = 'Тест iARPT — персональная карта изменений';
    attempt.frame.referrerPolicy = 'strict-origin-when-cross-origin';
    attempt.frame.dataset.pending = '1';
    attempt.frame.src = url.href;
    attempts.push(attempt);
    stage.appendChild(attempt.frame);
    if (!external.href || i === 0) { external.href = source.url; external.hidden = false; }
    if (i > 0) showStatus('Подключаем резервный источник…', false);
    const myRun = run;
    later(() => { if (myRun === run && !winner) start(i + 1); }, Math.max(1500, Number(source.parallelAfterMs) || 2500));
  }
  function fail(attempt) {
    if (winner || attempt.failed) return;
    attempt.failed = true;
    const list = config().sources;
    if (attempt.index + 1 < list.length) start(attempt.index + 1);
    if (attempts.length && attempts.every(a => a.failed) && attempts.length >= list.length) giveUp();
  }
  function giveUp() {
    if (winner) return;
    clearTimers(); removeFrames(null);
    showStatus('Тест не загрузился. Проверьте интернет или откройте его в новой вкладке.', true);
  }
  function load() {
    run += 1; clearTimers(); winner = null; removeFrames(null);
    if (!config().sources.length) { showStatus('Источник теста настроен неверно.', true); return; }
    external.removeAttribute('href'); external.hidden = true;
    showStatus('Открываем тест…', false);
    start(0);
    const myRun = run;
    later(() => { if (myRun === run) giveUp(); }, config().giveUpMs);
  }
  window.addEventListener('message', event => {
    const d = event.data;
    if (!d || d.ns !== 'iarpt-quiz-handoff') return;
    const attempt = attempts.find(a => event.source === a.frame.contentWindow);
    if (!attempt || event.origin !== attempt.origin || d.channel !== attempt.channel) return;
    if (d.type === 'ready' && !winner) {
      winner = attempt; clearTimers(); removeFrames(attempt);
      delete attempt.frame.dataset.pending; status.hidden = true;
      external.href = attempt.source.url;
      return;
    }
    // Ошибка скрипта после старта теста не должна перезагружать тест и стирать ответы.
    if (d.type === 'error' && !winner) { fail(attempt); return; }
    if (attempt !== winner) return;
    if (d.type === 'close') close();
    if (d.type === 'focus-close') closeButton.focus({preventScroll:true});
  });
  function open(button) { if (!modal.hidden) return; opener = button || document.activeElement; previousOverflow = document.body.style.overflow; document.body.style.overflow = 'hidden'; modal.hidden = false; load(); closeButton.focus({preventScroll:true}); }
  function close() { run += 1; clearTimers(); winner = null; removeFrames(null); modal.hidden = true; document.body.style.overflow = previousOverflow; opener?.focus?.({preventScroll:true}); }
  retry.addEventListener('click', load);
  closeButton.addEventListener('click', close);
  modal.addEventListener('click', event => { if (event.target === modal) close(); });
  document.addEventListener('keydown', event => { if (event.key === 'Escape' && !modal.hidden) { event.preventDefault(); close(); } });
  document.addEventListener('click', event => {
    if (event.defaultPrevented || event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
    const button = event.target instanceof Element ? event.target.closest(triggerSelector) : null;
    if (!button) return;
    event.preventDefault(); open(button);
  }, true);
  window.IARPTQuiz = Object.freeze({open, close});
})();
</script>
